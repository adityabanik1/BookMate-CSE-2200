plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' // Firebase
}

android {
    namespace 'com.example.BookMate'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.BookMate"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Load Gemini API Key & optional Google Web Client ID securely from secrets.properties (ignored by Git)
        def secretsFile = rootProject.file("secrets.properties")
        def geminiApiKey = ""
        def googleWebClientId = ""
        if (secretsFile.exists()) {
            Properties properties = new Properties()
            properties.load(secretsFile.newDataInputStream())
            geminiApiKey = properties.getProperty("GEMINI_API_KEY", "")
            if (geminiApiKey != null) {
                geminiApiKey = geminiApiKey.trim()
                if ((geminiApiKey.startsWith("\"") && geminiApiKey.endsWith("\"")) ||
                    (geminiApiKey.startsWith("'") && geminiApiKey.endsWith("'"))) {
                    if (geminiApiKey.length() >= 2) {
                        geminiApiKey = geminiApiKey.substring(1, geminiApiKey.length() - 1).trim()
                    }
                }
            }
            googleWebClientId = properties.getProperty("GOOGLE_WEB_CLIENT_ID", "")
            if (googleWebClientId != null) {
                googleWebClientId = googleWebClientId.trim()
                if ((googleWebClientId.startsWith("\"") && googleWebClientId.endsWith("\"")) ||
                    (googleWebClientId.startsWith("'") && googleWebClientId.endsWith("'"))) {
                    if (googleWebClientId.length() >= 2) {
                        googleWebClientId = googleWebClientId.substring(1, googleWebClientId.length() - 1).trim()
                    }
                }
            }
        }
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // AndroidX Core & AppCompat
    implementation 'androidx.appcompat:appcompat:1.4.1'

    // Material Components (for MaterialButton, MaterialToolbar, FAB, etc.)
    implementation 'com.google.android.material:material:1.5.0'

    // ConstraintLayout for flexible XML layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'

    // CardView for item_book.xml card styling
    implementation 'androidx.cardview:cardview:1.0.0'

    // RecyclerView for book lists
    implementation 'androidx.recyclerview:recyclerview:1.2.1'

    // Firebase — the BoM (Bill of Materials) picks matching versions for all
    // Firebase libraries, so the lines below don't need their own version numbers.
    // 32.1.1 is used because it works with this project's compileSdk 33 / AGP 8.0.
    implementation platform('com.google.firebase:firebase-bom:32.1.1')
    implementation 'com.google.firebase:firebase-auth'      // Email/Password & Google login
    implementation 'com.google.android.gms:play-services-auth:20.7.0' // Google Sign-In SDK
    implementation 'com.google.firebase:firebase-firestore' // Cloud backup of books
    implementation 'com.google.firebase:firebase-database'  // Realtime community recommendations

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    // Real JSON parsing for provider-response regression tests (Android stubs cannot parse).
    testImplementation 'org.json:json:20180813'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}
